[project]
name = "graphs-api"
version = "0.1.0"
description = "API de demonstração de casos de uso de banco de grafos (OrientDB)"
authors = [{ name = "Vitor Rezende", email = "dev.rezendevitor@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "granian>=2.3.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.9.0",
    "uvloop>=0.23.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short"]
